[package]
name = "nexa-archiver"
version = "0.1.0"
edition = "2021"
description = "Compresses and extracts archives (zip, tar, gz, xz, bz2, zst) for Files and Archive, safely and confined with Landlock"

[dependencies]
libc = "0.2"
nexa-sys = { path = "../nexa-sys" }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = { version = "0.4", default-features = false }
flate2 = "1"
xz2 = { version = "0.1", features = ["static"] }
bzip2 = { version = "0.4", features = ["static"] }
zstd = { version = "0.13", default-features = false }
