[package]
name = "nexa-store"
version = "0.1.0"
edition = "2021"
description = "Nexa Store's engine: signed app catalogues, verified downloads, installed and update state"

[dependencies]
nexa-pack = { path = "../nexa-pack" }
nexa-sys = { path = "../nexa-sys" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
ed25519-dalek = "2"
