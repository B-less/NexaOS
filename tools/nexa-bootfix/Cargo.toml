[package]
name = "nexa-bootfix"
version = "0.1.0"
edition = "2021"
description = "Finds why Windows won't start (boot partition, boot manager, BCD, boot entries, Secure Boot keys), fixes the safe parts and saves a report"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
