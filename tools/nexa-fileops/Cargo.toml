description = "The Files app's engine: copy, move, rename, Trash, restore and undo, confined with Landlock"

[dependencies]
libc = "0.2"
nexa-sys = { path = "../nexa-sys" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
