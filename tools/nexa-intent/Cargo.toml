[package]
name = "nexa-intent"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "NexaOS's tiny command model: what a typed or spoken command asks for, about 1 MB, trained here from generated sentences"

[features]
# The trained model, built in (model/nexa-intent.bin). Off for the trainer,
# which makes that file.
builtin = []

# The trainer is an example (cargo run --release --example nexa-intent-train):
# a tool for making the model, not part of the system.
[[example]]
name = "nexa-intent-train"
path = "examples/nexa-intent-train.rs"

[dependencies]
