[package]
name = "nexa-tools"
version = "0.1.0"
edition = "2021"
description = "Nexa Mind's tool runner: sandboxed, undoable file actions for the assistant"
license = "MIT"

[dependencies]
libc = "0.2"
nexa-sys = { path = "../nexa-sys" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
