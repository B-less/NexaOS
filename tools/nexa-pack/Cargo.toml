[package]
name = "nexa-pack"
version = "0.1.0"
edition = "2021"
description = "Build, sign and verify NexaOS .nexa packages"
license = "MIT"

[dependencies]
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
