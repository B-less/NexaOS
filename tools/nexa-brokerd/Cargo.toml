[package]
name = "nexa-brokerd"
version = "0.1.0"
edition = "2021"
description = "NexaOS system broker: the one checked, sandboxed, audited way to change the system as root"

[dependencies]
libc = "0.2"
nexa-sys = { path = "../nexa-sys" }
serde_json = "1"

[[bin]]
name = "nexa-brokerd"
path = "src/main.rs"
