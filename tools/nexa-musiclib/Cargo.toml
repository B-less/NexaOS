[package]
name = "nexa-musiclib"
version = "0.1.0"
edition = "2021"
description = "The Music app's library: reads tags, lengths and cover art (MP3, FLAC, Ogg, Opus, M4A, WAV), keeps the index, reads and writes playlists"

[dependencies]
libc = "0.2"
nexa-sys = { path = "../nexa-sys" }
serde_json = "1"
