[package]
name = "nexa-linkd"
version = "0.1.0"
edition = "2021"
description = "Nexa Link: paired NexaOS devices find each other and talk, encrypted, with no cloud"

[dependencies]
getrandom = "0.2"
hmac = "0.12"
libc = "0.2"
nexa-sys = { path = "../nexa-sys" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snow = "0.9"
qrcode = { version = "0.14", default-features = false }
