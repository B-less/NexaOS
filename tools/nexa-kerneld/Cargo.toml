[package]
name = "nexa-kerneld"
version = "0.1.0"
edition = "2021"
description = "Nexa Mind's kernel link: pressure, process and OOM events, power, and steering the scheduler for the AI and the app in front"

[dependencies]
libc = "0.2"
nexa-sys = { path = "../nexa-sys" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
