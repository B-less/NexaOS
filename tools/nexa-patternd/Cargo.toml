[package]
name = "nexa-patternd"
version = "0.1.0"
edition = "2021"
description = "Nexa Patterns: learns which apps you use when and after what, on the device, and predicts what you'll open next"

[dependencies]
libc = "0.2"
nexa-sys = { path = "../nexa-sys" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
