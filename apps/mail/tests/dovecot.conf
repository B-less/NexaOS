dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0
protocols = imap
listen = 127.0.0.1
log_path = /tmp/dovecot.log
base_dir = /tmp/dovecot-run
ssl = required
ssl_server_cert_file = /tmp/tls/server.pem
ssl_server_key_file = /tmp/tls/server.key
auth_mechanisms = plain login
default_internal_user = dovecot
default_login_user = dovenull
mail_driver = maildir
mail_path = ~/Maildir
mail_home = /tmp/mailhome/%{user}
passdb passwd-file {
  passwd_file_path = /tmp/dovecot.users
}
userdb static {
  fields {
    uid = vmail
    gid = vmail
  }
}
namespace inbox {
  inbox = yes
  separator = /
  mailbox Sent {
    special_use = \Sent
    auto = create
  }
  mailbox Trash {
    special_use = \Trash
    auto = create
  }
  mailbox Drafts {
    special_use = \Drafts
    auto = create
  }
  mailbox Junk {
    special_use = \Junk
    auto = create
  }
}
service imap-login {
  inet_listener imaps {
    port = 993
    ssl = yes
  }
  inet_listener imap {
    port = 143
  }
}
