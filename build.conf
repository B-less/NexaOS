# NexaOS Build Configuration
# This file centralizes all build parameters and versions

# === Project Metadata ===
PROJECT_NAME=NexaOS
PROJECT_VERSION=3.2.0
PROJECT_AUTHOR=Nexa Development Team
BUILD_DATE=$(date +%Y-%m-%d)

# === Build Paths ===
BASE_DIR=$(CURDIR)
BUILD_DIR=$(BASE_DIR)/build
DIST_DIR=$(BASE_DIR)/dist
MNT_DIR=$(BASE_DIR)/mnt
ROOTFS_DIR=$(BASE_DIR)/rootfs
KERNEL_DIR=$(BASE_DIR)/kernel
CACHE_DIR=$(BASE_DIR)/.build_cache

# === Versions ===
KERNEL_VERSION=6.18.33
ALPINE_VERSION=3.24.2
ALPINE_ARCH=x86_64
BUSYBOX_VERSION=1.37.0
MUSL_VERSION=1.2.4

# === Wayland Desktop Stack ===
WAYLAND_VERSION=1.22.0
WLROOTS_VERSION=0.17.1
SWAY_VERSION=1.8.1
WAYBAR_VERSION=1.9.1

# === Applications ===
FOOT_VERSION=1.18.0
TOFI_VERSION=0.8.0

# === Build Flags ===
CFLAGS_COMMON=-Wall -Wextra -O2
CFLAGS_STATIC=-static
STRIP_BINARIES=yes
ENABLE_LTO=no
ENABLE_SECURITY_HARDENING=yes

# === Features ===
ENABLE_WAYLAND=yes
ENABLE_SWAY=yes
ENABLE_WAYBAR=yes
ENABLE_SSH=yes
ENABLE_SYSLOG=yes
ENABLE_CRON=yes
BUILD_APPLICATIONS=yes
USE_APK_PACKAGES=yes

# === Disk Image ===
DISK_SIZE=2G
DISK_FORMAT=ext4
DISK_FILE=$(BASE_DIR)/nexa.img

# === ISO Build ===
BUILD_ISO=yes
ISO_OUTPUT=$(DIST_DIR)/NexaOS-$(PROJECT_VERSION).iso
ISOLINUX_VERSION=6.04

# === QEMU Emulation ===
QEMU_CPU=host
QEMU_RAM=4G
QEMU_CORES=4
QEMU_DISPLAY=gtk
QEMU_NETWORKING=user
QEMU_VIRTIO_GPU=yes
QEMU_VIRTIO_INPUT=yes

# === Container Build ===
DOCKER_IMAGE=nexaos/build:latest
CONTAINER_RUNTIME=docker

# === Toolchain ===
CC=gcc
CXX=g++
LD=ld
AR=ar
STRIP=strip
OBJCOPY=objcopy

# === Logging ===
LOG_LEVEL=info
BUILD_LOG=$(BUILD_DIR)/build.log
BOOT_LOG=/logs/boot.log

# === Security ===
ENABLE_DEP=yes
ENABLE_ASLR=yes
ENABLE_STACK_CHECK=yes
KERNEL_HARDENING=yes

# === Networking ===
DNS_PRIMARY=8.8.8.8
DNS_SECONDARY=8.8.4.4
HOSTNAME=nexa
DHCP_ENABLED=yes

# === Package Management ===
PKG_CACHE_DIR=/var/cache/pkg
PKG_DB_DIR=/var/lib/pkg

# === Development Settings ===
DEBUG_SYMBOLS=no
VERBOSE_BUILD=yes
KEEP_BUILD_ARTIFACTS=no
PARALLEL_JOBS=$(shell nproc)

# === Color Output ===
COLOR_RESET=\033[0m
COLOR_GREEN=\033[32m
COLOR_YELLOW=\033[33m
COLOR_BLUE=\033[34m

# === Alpine Linux Bootstrap ===
ALPINE_REPO=https://dl-cdn.alpinelinux.org/alpine/v3.24
ALPINE_PACKAGES_CORE=alpine-base,busybox,openrc,openssh
ALPINE_PACKAGES_DEV=build-base,linux-headers,pkgconfig,cmake,git
ALPINE_PACKAGES_WAYLAND=wayland,wayland-protocols,libxkbcommon,mesa,mesa-dri-gallium,mesa-egl,mesa-gbm
ALPINE_PACKAGES_SWAY=sway,swaybg,swaylock-effects,swayidle,hyprland,waybar,wofi,dbus,seatd,eudev,xdg-desktop-portal-wlr,mako,libnotify
ALPINE_PACKAGES_TERM=bash,foot
ALPINE_PACKAGES_UTILS=curl,wget,ca-certificates,htop,nano,file,font-noto,font-noto-emoji,ttf-dejavu,gsettings-desktop-schemas,python3,pciutils,usbutils,py3-gobject3,librsvg,doas,adwaita-icon-theme,gtksourceview4,gstreamer,gst-plugins-base,gst-plugins-good,gst-plugins-ugly,gst-plugins-bad,gst-libav,py3-gst,gtk-layer-shell,grim,slurp,wl-clipboard,webkit2gtk-4.1,zip,unzip,poppler-glib,desktop-file-utils,pipewire,pipewire-alsa,pipewire-pulse,wireplumber,gst-plugin-pipewire,iwd,iwd-openrc,linux-firmware-other,linux-firmware-intel,linux-firmware-i915,linux-firmware-amdgpu,linux-firmware-rtl_nic,linux-firmware-rtlwifi,linux-firmware-rtw88,linux-firmware-rtw89,linux-firmware-mediatek,linux-firmware-ath10k,linux-firmware-ath11k,linux-firmware-brcm,linux-firmware-cypress,tzdata,xkeyboard-config,bubblewrap,xdg-dbus-proxy,parted,e2fsprogs,e2fsprogs-extra,dosfstools,grub,grub-bios,grub-efi,util-linux,brightnessctl,nftables,font-awesome,py3-cairo,wireless-regdb,hicolor-icon-theme,gtk-update-icon-cache,tor,bluez,bluez-openrc,pipewire-spa-bluez,wireguard-tools,linux-firmware-rtl_bt,util-linux-misc,font-inter,font-jetbrains-mono

# === Build Rootfs Method ===
ROOTFS_METHOD=alpine-chroot
# Options: alpine-chroot, alpine-minirootfs

# === Application Build Flags ===
APP_CFLAGS=$(CFLAGS_COMMON) -fPIC
APP_LDFLAGS=-Wl,-z,relro,-z,now
STRIP_APPS=yes
