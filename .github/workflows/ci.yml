name: NexaOS checks

# Runs on every push and pull request: the Rust workspace (tests + static
# release build, in the same Alpine builder image as `make native`), then
# every Python suite against those binaries. The full ISO isn't built here
# yet: the kernel source isn't in the repository.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Rust (tests + static build)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache crates and build output
        uses: actions/cache@v4
        with:
          path: |
            /var/tmp/nexa-cargo
            tools/target
          key: native-${{ hashFiles('tools/Cargo.lock') }}-${{ github.sha }}
          restore-keys: native-${{ hashFiles('tools/Cargo.lock') }}-

      - name: Workspace tests (nexa-sys, nexa-pack, nexa-mindd, nexa-tools, nexa-brokerd)
        run: sh scripts/build-native.sh test

      - name: Static release build
        run: sh scripts/build-native.sh

      - uses: actions/upload-artifact@v4
        with:
          name: native
          path: build/native/
          retention-days: 14

  python:
    name: Python suites
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: native
          path: build/native/

      - name: Test dependencies (GLib bindings and a D-Bus session for the mock iwd/BlueZ)
        run: |
          chmod +x build/native/*
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends python3-gi gir1.2-glib-2.0 dbus dbus-daemon

      - name: make test
        run: make test
